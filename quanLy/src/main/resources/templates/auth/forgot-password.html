<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/library-ui.css" rel="stylesheet">
</head>
<body>
<section class="lib-hero">
    <div class="container position-relative">
        <span class="eyebrow"><i class="fas fa-unlock-keyhole"></i>Quên mật khẩu</span>
        <h1 class="display-5 fw-bold mb-3">Quên Mật Khẩu</h1>
        <p class="lead mb-0 text-white-50">Đặt lại mật khẩu cho tài khoản giáo viên hoặc sinh viên.</p>
    </div>
</section>

<div class="container my-5">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Có lỗi xảy ra.</div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}">Thành công.</div>
    <div class="row justify-content-center">
        <div class="col-xl-7 col-lg-8">
            <div class="lib-form-shell">
                <div class="lib-form-head warning">
                    <h4 class="mb-1"><i class="fas fa-user-lock me-2"></i>Đặt lại mật khẩu</h4>
                    <p class="mb-0 text-white-50">Nhập tên đăng nhập và mật khẩu mới để khôi phục quyền truy cập.</p>
                </div>
                <div class="lib-form-body">
                    <form method="post" th:action="@{/quen-mat-khau}" class="d-grid gap-3">
                        <div>
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" name="username" class="form-control" placeholder="giaovien / sinhvien" required>
                        </div>
                        <div>
                            <label class="form-label">Mật khẩu mới</label>
                            <input type="password" name="newPassword" class="form-control" required>
                        </div>
                        <div>
                            <label class="form-label">Xác nhận mật khẩu mới</label>
                            <input type="password" name="confirmPassword" class="form-control" required>
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-warning">Đặt lại mật khẩu</button>
                            <a href="/login" class="btn btn-outline-secondary">Về đăng nhập</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
