<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Tài Liệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/library-ui.css" rel="stylesheet">
</head>
<body>
    <div class="admin-shell">
        <aside th:replace="~{fragments/sidebar :: librarySidebar('taiLieu')}"></aside>

        <main class="admin-main">
            <div th:if="${error}" class="alert alert-danger mb-3" role="alert" th:text="${error}">Có lỗi xảy ra.</div>
            <header class="catalog-topbar">
                <div>
                    <h1 class="catalog-page-title mb-1">Thêm Tài Liệu Mới</h1>
                    <p class="catalog-page-subtitle mb-0">Nhập mã, tác giả, nhà xuất bản, ngày nhập và vị trí.</p>
                </div>
                <div class="catalog-actions">
                    <a href="/taiLieu" class="btn btn-outline-secondary"><i class="fas fa-list me-2"></i>Danh sách</a>
                </div>
            </header>

            <div class="row justify-content-center">
                <div class="col-xl-8 col-lg-10">
                    <div class="lib-form-shell">
                        <div class="lib-form-head">
                            <h4 class="mb-1"><i class="fas fa-book-open me-2"></i>Thông tin tài liệu</h4>
                            <p class="mb-0 text-white-50">Nhập đúng các thông tin cần cho tra cứu và chi tiết.</p>
                        </div>
                        <div class="lib-form-body">
                            <form th:action="@{/taiLieu}" method="post" th:object="${hangHoa}">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label">Mã tài liệu</label>
                                        <input type="text" class="form-control" th:field="*{hanghoaID}" placeholder="TL005">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Tác giả</label>
                                        <input type="text" class="form-control" th:field="*{nhaSanXuat}" placeholder="Nguyễn Văn A" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Nhà xuất bản</label>
                                        <input type="text" class="form-control" th:field="*{nhaXuatBan}" placeholder="NXB Giáo dục" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Ngày nhập</label>
                                        <input type="datetime-local" class="form-control" th:field="*{ngayNhap}" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Vị trí</label>
                                        <input type="text" class="form-control" th:field="*{viTri}" placeholder="Kệ CNTT A1">
                                    </div>
                                </div>

                                <div class="lib-form-footer text-center">
                                    <button type="submit" class="btn btn-success btn-lg me-2">
                                        <i class="fas fa-save me-2"></i>Lưu tài liệu
                                    </button>
                                    <a href="/taiLieu" class="btn btn-outline-secondary btn-lg">
                                        <i class="fas fa-xmark me-2"></i>Hủy
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
